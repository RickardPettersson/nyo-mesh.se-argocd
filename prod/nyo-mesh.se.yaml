apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: nyo-mesh-se-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyo-mesh-se
  namespace: nyo-mesh-se-prod
  labels:
    app: nyo-mesh-se
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nyo-mesh-se
  template:
    metadata:
      labels:
        app: nyo-mesh-se
    spec:
      containers:
        - name: nyo-mesh-se
          image: ghcr.io/rickardpettersson/nyo-mesh.se:sha-f8180a9
          ports:
            - containerPort: 80
          # /healthz kommer från nginx/default.conf i app-repot.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          # Statisk nginx: liten och förutsägbar. Requests håller podden ur
          # BestEffort-klassen så den inte dödas först vid minnestryck.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nyo-mesh-se
  namespace: nyo-mesh-se-prod
  labels:
    app: nyo-mesh-se
spec:
  selector:
    app: nyo-mesh-se
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyo-mesh-se
  namespace: nyo-mesh-se-prod
  labels:
    app: nyo-mesh-se
spec:
  ingressClassName: nginx
  rules:
    - host: nyo-mesh.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nyo-mesh-se
                port:
                  number: 80
